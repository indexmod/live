<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LIVE Stream</title>
  <meta name="theme-color" content="#000000" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: black;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #playButton {
      width: 0;
      height: 0;
      border-left: 150px solid white;
      border-top: 100px solid transparent;
      border-bottom: 100px solid transparent;
      cursor: pointer;
      z-index: 10;
      transition: opacity 0.5s ease;
    }

    #introText {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 2s ease;
      z-index: 5;
    }

    #introText.visible {
      opacity: 1;
    }

    #introText.fadeout {
      opacity: 0;
      transition: opacity 2s ease;
    }

    #introTextInner {
      border: 2px solid white;
      padding: 40px;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 30px;
      line-height: 1.5;
      max-width: 800px;
      text-align: left;
    }

    video {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
      display: none;
      background: black;
    }
  </style>
</head>
<body>

  <div id="playButton"></div>

  <div id="introText">
    <div id="introTextInner">
      <p><strong>LIVE — это потоковое произведение.</strong></p>
      <p>Проект исследует пересечение звука и движения, где ритм и изображение создают единую живую среду.</p>
    </div>
  </div>

  <video id="videoPlayer" muted playsinline></video>
  <audio id="audioPlayer" loop src="audio.mp3"></audio>

  <script>
    const playButton = document.getElementById('playButton');
    const introText = document.getElementById('introText');
    const videoPlayer = document.getElementById('videoPlayer');
    const audioPlayer = document.getElementById('audioPlayer');

    const videos = [
      '1.mp4',
      '2.mp4',
      '3.mp4',
      '4.mp4',
      '5.mp4',
      '6.mp4'
    ];

    let loadedVideos = [];
    let lastVideo = null;

    // --- Предзагрузка аудио ---
    function preloadAudio() {
      return new Promise(resolve => {
        audioPlayer.preload = 'auto';
        audioPlayer.addEventListener('canplaythrough', () => resolve(), { once: true });
        audioPlayer.load();
      });
    }

    // --- Последовательная загрузка видео ---
    function preloadVideosSequentially(onFirstReady) {
      const queue = [...videos];

      function loadNext() {
        if (queue.length === 0) return;
        const nextSrc = queue.shift();

        const vid = document.createElement('video');
        vid.src = nextSrc;
        vid.preload = 'auto';
        vid.muted = true;
        vid.playsInline = true;

        vid.addEventListener('canplaythrough', () => {
          loadedVideos.push(nextSrc);
          console.log('Видео готово:', nextSrc);
          if (loadedVideos.length === 1) onFirstReady(nextSrc);
          loadNext();
        }, { once: true });

        vid.load();
      }

      loadNext();
    }

    // --- Выбор видео ---
    function getRandomVideo() {
      const available = loadedVideos.filter(v => v !== lastVideo);
      if (available.length === 0) return lastVideo;
      const chosen = available[Math.floor(Math.random() * available.length)];
      lastVideo = chosen;
      return chosen;
    }

    // --- Ротация видео ---
    function startVideoRotation() {
      setInterval(() => {
        if (loadedVideos.length > 1) {
          const next = getRandomVideo();
          videoPlayer.src = next;
          videoPlayer.play().catch(err => console.warn('Ошибка при воспроизведении видео:', err));
        }
      }, 4000);
    }

    // --- Основной запуск ---
    async function startPlayback() {
      playButton.style.opacity = '0';
      setTimeout(() => (playButton.style.display = 'none'), 600);

      introText.classList.add('visible');

      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      await audioContext.resume();

      // Начинаем загрузку аудио
      await preloadAudio();
      audioPlayer.play().catch(err => console.warn('Аудио не запущено:', err));

      // Загружаем видео
      preloadVideosSequentially(firstVideo => {
        videoPlayer.src = firstVideo;
        videoPlayer.style.display = 'block';
        videoPlayer.play().catch(e => console.log('Видео не запустилось:', e));

        // Плавное исчезновение текста
        introText.classList.add('fadeout');
        setTimeout(() => (introText.style.display = 'none'), 2000);

        startVideoRotation();
      });
    }

    playButton.addEventListener('click', startPlayback);
  </script>
</body>
</html>
