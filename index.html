<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LIVE Stream</title>
  <meta name="theme-color" content="#000000" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: black;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #playButton {
      width: 0;
      height: 0;
      border-left: 150px solid white;
      border-top: 100px solid transparent;
      border-bottom: 100px solid transparent;
      cursor: pointer;
      transition: opacity 0.3s;
      z-index: 10;
    }

    #loader {
      font-size: 300px;
      color: white;
      font-family: Arial, sans-serif;
      display: none;
      user-select: none;
      z-index: 10;
    }

    video {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
      display: none;
      background: black;
    }
  </style>
</head>
<body>

  <div id="playButton"></div>
  <div id="loader">0%</div>
  <video id="videoPlayer" muted playsinline></video>
  <audio id="audioPlayer" loop src="audio.mp3"></audio>

  <script>
    const playButton = document.getElementById('playButton');
    const loader = document.getElementById('loader');
    const videoPlayer = document.getElementById('videoPlayer');
    const audioPlayer = document.getElementById('audioPlayer');

    const videos = [
      '1.m4v',
      '2.m4v',
      '3.m4v',
      '4.m4v',
      '5.m4v',
      '6.m4v'
    ];

    let loadedVideos = new Set();
    let lastVideo = null;
    let firstVideoLoaded = false;
    let audioReady = false;

    // Предзагрузка одного видео с процентом прогресса
    function preloadFirstVideo() {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', videos[0], true);
        xhr.responseType = 'blob';
        xhr.onprogress = e => {
          if (e.lengthComputable) {
            const percent = Math.round((e.loaded / e.total) * 100);
            loader.textContent = percent + '%';
          }
        };
        xhr.onload = () => {
          if (xhr.status === 200) {
            const blobUrl = URL.createObjectURL(xhr.response);
            loadedVideos.add(videos[0]);
            firstVideoLoaded = true;
            resolve(blobUrl);
          } else reject();
        };
        xhr.onerror = reject;
        xhr.send();
      });
    }

    // Фоновая предзагрузка остальных видео
    function preloadOtherVideos() {
      videos.slice(1).forEach(v => {
        const vid = document.createElement('video');
        vid.src = v;
        vid.preload = 'auto';
        vid.muted = true;
        vid.playsInline = true;
        vid.addEventListener('canplaythrough', () => {
          loadedVideos.add(v);
        }, { once: true });
      });
    }

    // Проверка готовности аудио
    function preloadAudio() {
      return new Promise(resolve => {
        audioPlayer.preload = 'auto';
        audioPlayer.addEventListener('canplaythrough', () => {
          audioReady = true;
          resolve();
        }, { once: true });
        audioPlayer.load();
      });
    }

    // Случайный выбор следующего видео
    function getRandomVideo() {
      const available = Array.from(loadedVideos).filter(v => v !== lastVideo);
      if (available.length === 0) return lastVideo;
      const chosen = available[Math.floor(Math.random() * available.length)];
      lastVideo = chosen;
      return chosen;
    }

    // Смена видео каждые 4 секунды
    function startVideoLoop() {
      videoPlayer.style.display = 'block';
      function nextVideo() {
        const next = getRandomVideo();
        if (next) {
          videoPlayer.src = next;
          videoPlayer.play().catch(()=>{});
        }
      }
      nextVideo();
      setInterval(nextVideo, 4000);
    }

    // Основной запуск
    async function startLaunch() {
      loader.style.display = 'block';

      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      await audioContext.resume();

      const [firstVideoURL] = await Promise.all([
        preloadFirstVideo(),
        preloadAudio()
      ]);

      if (!firstVideoLoaded || !audioReady) {
        alert('Ошибка: не удалось загрузить аудио или видео.');
        location.reload();
        return;
      }

      // Запускаем основное видео и звук
      videoPlayer.src = firstVideoURL;
      videoPlayer.style.display = 'block';
      try {
        await Promise.all([videoPlayer.play(), audioPlayer.play()]);
      } catch (e) {
        console.error('Ошибка запуска медиа:', e);
      }

      // Фоновая загрузка остальных
      preloadOtherVideos();

      // Запуск ротации
      startVideoLoop();
      loader.style.display = 'none';
    }

    playButton.addEventListener('click', () => {
      playButton.style.display = 'none';
      startLaunch();
    });
  </script>
</body>
</html>
