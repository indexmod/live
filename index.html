<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIVE Stream</title>
<style>
html, body { margin:0; padding:0; width:100%; height:100%; background:black; overflow:hidden; }
body { display:flex; justify-content:center; align-items:center; }
#playButton, #audioButton {
  width:0; height:0; border-left:120px solid white; border-top:80px solid transparent; border-bottom:80px solid transparent;
  cursor:pointer; z-index:10; transition:opacity 1s; margin:10px;
}
#audioButton { border-left-color:lime; }
#introText { position:fixed; inset:0; background:black; color:white; font-family:Arial,sans-serif;
  font-size:26px; display:flex; justify-content:center; align-items:center; padding:60px; box-sizing:border-box;
  text-align:center; opacity:0; transition:opacity 2s; z-index:9; }
video { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; background:black; z-index:1; }
.fade-in { opacity:1 !important; }
.fade-out { opacity:0 !important; }
</style>
</head>
<body>

<div id="playButton"></div>
<div id="audioButton"></div>
<div id="introText">Miserablism</div>

<video id="videoPlayer" muted playsinline></video>
<audio id="audioPlayer" loop></audio>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
const playButton = document.getElementById('playButton');
const audioButton = document.getElementById('audioButton');
const introText = document.getElementById('introText');
const video = document.getElementById('videoPlayer');
const audio = document.getElementById('audioPlayer');

const BASE = location.origin + "/live";
const HLS_URL = BASE + "/video.m3u8";
const AUDIO_URL = BASE + "/audio.mp3";
audio.src = AUDIO_URL;
audio.loop = true;

// Запуск видео
playButton.addEventListener('click', async () => {
  playButton.style.display = 'none';
  introText.classList.add('fade-in');

  // AudioContext нужен только для аудио, можно не использовать для видео
  if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(HLS_URL);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
    video.addEventListener('ended', () => { video.currentTime=0; video.play(); });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = HLS_URL;
    video.loop = true;
    video.addEventListener('loadedmetadata', () => video.play());
  }

  setTimeout(()=>introText.classList.add('fade-out'), 500);
});

// Отдельный запуск аудио
audioButton.addEventListener('click', async () => {
  audioButton.style.display = 'none';
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();
  audio.play().catch(e => console.log("Audio error:", e));
});
</script>

</body>
</html>
