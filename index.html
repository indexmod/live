<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LIVE Stream</title>
  <meta name="theme-color" content="#000000" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: black;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #playButton {
      width: 0;
      height: 0;
      border-left: 150px solid white;
      border-top: 100px solid transparent;
      border-bottom: 100px solid transparent;
      cursor: pointer;
      z-index: 10;
    }

    #preloader {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: white;
      color: black;
      font-size: 80px;
      font-family: Arial, sans-serif;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9;
    }

    video {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
      display: none;
      background: black;
    }
  </style>
</head>
<body>

  <div id="playButton"></div>
  <div id="preloader">Загрузка...</div>
  <video id="videoPlayer" muted playsinline></video>
  <audio id="audioPlayer" loop src="audio.mp3"></audio>

  <script>
    const playButton = document.getElementById('playButton');
    const preloader = document.getElementById('preloader');
    const videoPlayer = document.getElementById('videoPlayer');
    const audioPlayer = document.getElementById('audioPlayer');

    // Временно используем mp4 для теста
    const videos = [
      '1.mp4',
      '2.mp4',
      '3.mp4',
      '4.mp4',
      '5.mp4',
      '6.mp4'
    ];

    let loadedVideos = [];
    let lastVideo = null;

    function preloadAudio() {
      return new Promise(resolve => {
        audioPlayer.preload = 'auto';
        audioPlayer.addEventListener('canplaythrough', () => {
          console.log('Аудио готово');
          resolve();
        }, { once: true });
        audioPlayer.load();
      });
    }

    function preloadVideosSequentially() {
      const queue = [...videos];

      function loadNext() {
        if (queue.length === 0) return;

        const nextSrc = queue.shift();
        const vid = document.createElement('video');
        vid.src = nextSrc;
        vid.preload = 'auto';
        vid.muted = true;
        vid.playsInline = true;

        vid.addEventListener('canplaythrough', () => {
          loadedVideos.push(nextSrc);
          console.log('Видео готово:', nextSrc);

          // Если это первое — показать
          if (loadedVideos.length === 1) {
            videoPlayer.src = nextSrc;
            videoPlayer.style.display = 'block';
            videoPlayer.play().catch(e => console.log('Видео не запустилось:', e));
          }

          loadNext();
        }, { once: true });

        vid.load();
      }

      loadNext();
    }

    function getRandomVideo() {
      const available = loadedVideos.filter(v => v !== lastVideo);
      if (available.length === 0) return lastVideo;
      const chosen = available[Math.floor(Math.random() * available.length)];
      lastVideo = chosen;
      return chosen;
    }

    function startVideoRotation() {
      setInterval(() => {
        if (loadedVideos.length > 1) {
          const next = getRandomVideo();
          videoPlayer.src = next;
          videoPlayer.play();
        }
      }, 4000);
    }

    async function startPlayback() {
      playButton.style.display = 'none';
      preloader.style.display = 'flex';
      preloader.textContent = 'Загрузка аудио...';

      await preloadAudio();
      preloader.textContent = 'Аудио готово';

      try {
        await audioPlayer.play();
        console.log('Аудио играет');
      } catch (e) {
        console.error('Ошибка запуска аудио:', e);
      }

      preloader.textContent = 'Загрузка видео...';
      preloadVideosSequentially();

      // Через секунду убираем прелоадер
      setTimeout(() => {
        preloader.style.display = 'none';
      }, 1000);

      startVideoRotation();
    }

    playButton.addEventListener('click', async () => {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      await audioContext.resume();
      startPlayback();
    });
  </script>
</body>
</html>
