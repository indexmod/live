<style>
html, body {
  margin:0; padding:0;
  width:100%; height:100%;
  background:black;
  overflow:hidden;
  font-family:Arial, sans-serif;
}
body { display:flex; justify-content:center; align-items:center; }

/* Play button */
#playButton {
  width:0; height:0;
  border-left:120px solid white;
  border-top:80px solid transparent;
  border-bottom:80px solid transparent;
  cursor:pointer; z-index:10; transition:opacity 1s;
}

/* Intro text */
#introText {
  position:fixed; inset:0;
  background:black; color:white;
  font-size:26px;
  display:flex; justify-content:center; align-items:center;
  padding:60px; text-align:center;
  opacity:0; transition:opacity 4s ease;
  z-index:9;
}

/* Video */
video {
  position:fixed; inset:0;
  width:100%; height:100%;
  object-fit:cover; background:black;
  opacity:0; transition:opacity 10s ease; z-index:1;
}
.fade-in { opacity:1 !important; }
.fade-out { opacity:0 !important; }
</style>
</head>
<body>

<div id="playButton"></div>
<div id="introText">Miserablism</div>

<video id="videoPlayer" playsinline></video>
<audio id="audioPlayer"></audio>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
const video = document.getElementById('videoPlayer');
const audio = document.getElementById('audioPlayer');
const playButton = document.getElementById('playButton');
const introText = document.getElementById('introText');

const VIDEO_HLS = "/video/video.m3u8";
const AUDIO_HLS = "/audio/audio.m3u8";

playButton.addEventListener('click', async () => {
  playButton.style.opacity = 0;
  setTimeout(() => playButton.remove(), 1000);
  introText.classList.add('fade-in');

  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();

  // -------- AUDIO --------
  if (Hls.isSupported()) {
    const hlsAudio = new Hls({ maxBufferLength: 30, liveSyncDuration: 0, enableWorker: true });
    hlsAudio.loadSource(AUDIO_HLS);
    hlsAudio.attachMedia(audio);
    hlsAudio.on(Hls.Events.MANIFEST_PARSED, () => audio.play().catch(()=>{}));
  } else { audio.src = AUDIO_HLS; audio.play().catch(()=>{}); }
  audio.loop = true;

  // -------- VIDEO --------
  if (Hls.isSupported()) {
    const hlsVideo = new Hls({ maxBufferLength: 10, backBufferLength: 5, enableWorker: true });
    hlsVideo.loadSource(VIDEO_HLS);
    hlsVideo.attachMedia(video);
    hlsVideo.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play().catch(()=>{});
      video.classList.add('fade-in');
    });
  } else {
    video.src = VIDEO_HLS;
    video.addEventListener('loadedmetadata', () => {
      video.play().catch(()=>{});
      video.classList.add('fade-in');
    });
  }

  setTimeout(() => introText.classList.add('fade-out'), 1500);
});
</script>

</body>
