<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIVE Stream</title>
<style>
html, body { margin:0; padding:0; width:100%; height:100%; background:black; overflow:hidden; }
body { display:flex; justify-content:center; align-items:center; }
#playButton { width:0; height:0; border-left:120px solid white; border-top:80px solid transparent; border-bottom:80px solid transparent; cursor:pointer; z-index:10; transition:opacity 1s; }
#introText { position:fixed; inset:0; background:black; color:white; font-family:Arial,sans-serif; font-size:26px; display:flex; justify-content:center; align-items:center; padding:60px; box-sizing:border-box; text-align:center; opacity:0; transition:opacity 2s; z-index:9; }
video { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; background:black; z-index:1; }
.fade-in { opacity:1 !important; }
.fade-out { opacity:0 !important; }
</style>
</head>
<body>

<div id="playButton"></div>
<div id="introText">Miserablism</div>

<video id="videoPlayer" muted playsinline></video>
<audio id="audioPlayer" loop></audio>

<!-- HLS.js -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
const playButton = document.getElementById('playButton');
const introText = document.getElementById('introText');
const video = document.getElementById('videoPlayer');
const audio = document.getElementById('audioPlayer');

const BASE = location.origin + "/live";
const HLS_URL = BASE + "/video.m3u8";
audio.src = BASE + "/audio.mp3";
audio.loop = true;

playButton.addEventListener('click', async () => {
  // Скрываем кнопку и показываем текст
  playButton.style.display = 'none';
  introText.classList.add('fade-in');

  // AudioContext для обхода блокировок
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();

  // Воспроизведение аудио
  audio.play().catch(err => console.warn("Audio failed:", err));

  // HLS видео
  if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(HLS_URL);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(e => console.log("Video error:", e)));
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    // Safari
    video.src = HLS_URL;
    video.addEventListener('loadedmetadata', () => video.play().catch(e => console.log("Video error:", e)));
  }

  // Скрываем текст через 0.5 сек
  setTimeout(() => introText.classList.add('fade-out'), 500);
});
</script>

</body>
</html>
