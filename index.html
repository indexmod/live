<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LIVE Stream</title>
  <meta name="theme-color" content="#000000" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: black;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #playButton {
      width: 0;
      height: 0;
      border-left: 150px solid white;
      border-top: 100px solid transparent;
      border-bottom: 100px solid transparent;
      cursor: pointer;
      transition: opacity 0.3s;
      z-index: 10;
    }

    #countdown {
      font-size: 300px;
      color: white;
      font-family: Arial, sans-serif;
      display: none;
      user-select: none;
      z-index: 10;
    }

    video {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
      display: none;
      background: black;
    }
  </style>
</head>
<body>

  <div id="playButton"></div>
  <div id="countdown"></div>
  <video id="videoPlayer" muted playsinline></video>
  <audio id="audioPlayer" loop src="audio.mp3"></audio>

  <script>
    const playButton = document.getElementById('playButton');
    const countdown = document.getElementById('countdown');
    const videoPlayer = document.getElementById('videoPlayer');
    const audioPlayer = document.getElementById('audioPlayer');

    const videos = [
      '1.m4v',
      '2.m4v',
      '3.m4v',
      '4.m4v',
      '5.m4v',
      '6.m4v'
    ];


    let lastVideo = null;
    let audioReady = false;
    let videosReady = 0;

    // Проверяем готовность к запуску
    function allReady() {
      return audioReady && videosReady === videos.length;
    }

    // Предзагрузка видео
    function preloadVideos() {
      videos.forEach(v => {
        const vid = document.createElement('video');
        vid.src = v;
        vid.preload = 'auto';
        vid.muted = true;
        vid.playsInline = true;
        vid.addEventListener('canplaythrough', () => {
          videosReady++;
        }, { once: true });
      });
    }

    // Предзагрузка аудио
    function preloadAudio() {
      return new Promise(resolve => {
        audioPlayer.preload = 'auto';
        audioPlayer.addEventListener('canplaythrough', () => {
          audioReady = true;
          resolve();
        }, { once: true });
        audioPlayer.load();
      });
    }

    // Случайный выбор видео (не повторять предыдущее)
    function getRandomVideo() {
      const available = videos.filter(v => v !== lastVideo);
      const chosen = available[Math.floor(Math.random() * available.length)];
      lastVideo = chosen;
      return chosen;
    }

    // Смена видео каждые 4 секунды
    function startVideoLoop() {
      videoPlayer.style.display = 'block';
      function nextVideo() {
        videoPlayer.src = getRandomVideo();
        videoPlayer.play();
      }
      nextVideo();
      setInterval(nextVideo, 4000);
    }

    // Обратный отсчёт с синхронным запуском
    async function startCountdownAndLaunch() {
      let count = 5;
      countdown.textContent = count;
      countdown.style.display = 'block';

      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      await audioContext.resume(); // снимаем ограничения браузера
      preloadVideos();
      preloadAudio();

      const timer = setInterval(() => {
        count--;
        if (count >= 0) {
          countdown.textContent = count;
        }
      }, 1000);

      // Ожидаем 5 секунд и проверяем готовность
      setTimeout(async () => {
        clearInterval(timer);
        countdown.style.display = 'none';

        // Подождём немного, если загрузка не успела завершиться
        const maxWait = 5000;
        const interval = 200;
        let waited = 0;
        while (!allReady() && waited < maxWait) {
          await new Promise(r => setTimeout(r, interval));
          waited += interval;
        }

        if (!allReady()) {
          alert("Ошибка: файлы не успели загрузиться. Попробуйте снова.");
          location.reload();
          return;
        }

        // Всё готово — синхронный запуск
        try {
          await audioPlayer.play();
          startVideoLoop();
        } catch (err) {
          console.error('Ошибка запуска:', err);
          alert('Браузер заблокировал запуск медиа. Нажмите ещё раз.');
          location.reload();
        }
      }, 5000);
    }

    playButton.addEventListener('click', () => {
      playButton.style.display = 'none';
      startCountdownAndLaunch();
    });
  </script>
</body>
</html>
