<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LIVE Stream</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: black;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #playButton {
      width: 0;
      height: 0;
      border-left: 120px solid white;
      border-top: 80px solid transparent;
      border-bottom: 80px solid transparent;
      cursor: pointer;
      z-index: 10;
      transition: opacity 1s ease;
    }

    #introText {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: left;
      padding: 80px;
      box-sizing: border-box;
      opacity: 0;
      transition: opacity 2s ease;
      z-index: 9;
    }

    video {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
      display: none;
      background: black;
    }

    .fade-in { opacity: 1 !important; }
    .fade-out { opacity: 0 !important; }
  </style>
</head>
<body>

  <div id="playButton"></div>
  <div id="introText">
    <div style="border:2px solid white; padding:20px;">
      Этот проект исследует лайв, который создаётся сам — без монтажа, без сценария.<br>
Видеофрагменты из мастерской художника объединяются в непрерывный поток. Потерпите идёт загрузка…
    </div>
  </div>
  <video id="videoPlayer" muted playsinline></video>
  <audio id="audioPlayer" loop src="audio.mp3"></audio>

  <script>
    const playButton = document.getElementById('playButton');
    const introText = document.getElementById('introText');
    const videoPlayer = document.getElementById('videoPlayer');
    const audioPlayer = document.getElementById('audioPlayer');

    const videos = ['01.MP4','02.MP4','03.MP4','04.MP4','05.MP4','06.MP4','07.MP4'];
    let loadedVideos = [];
    let currentIndex = 0;

    function preloadAudio() {
      return new Promise(resolve => {
        audioPlayer.preload = 'auto';
        audioPlayer.addEventListener('canplaythrough', resolve, { once: true });
        audioPlayer.load();
      });
    }

    // Предзагрузка всех видео заранее
    function preloadAllVideos() {
      return Promise.all(
        videos.map(src => new Promise(resolve => {
          const vid = document.createElement('video');
          vid.src = src;
          vid.preload = 'auto';
          vid.addEventListener('canplaythrough', () => {
            loadedVideos.push(src);
            resolve();
          }, { once: true });
          vid.load();
        }))
      );
    }

    function startVideoSequence() {
      if (loadedVideos.length === 0) return;
      videoPlayer.src = loadedVideos[currentIndex];
      videoPlayer.style.display = 'block';
      videoPlayer.play();

      videoPlayer.addEventListener('ended', () => {
        currentIndex = (currentIndex + 1) % loadedVideos.length;
        videoPlayer.src = loadedVideos[currentIndex];
        videoPlayer.play();
      });
    }

    async function startPlayback() {
      playButton.style.display = 'none';
      introText.classList.add('fade-in');

      await preloadAudio();
      await audioPlayer.play();

      await preloadAllVideos();

      // Когда загружено хотя бы одно видео — показываем его
      setTimeout(() => {
        introText.classList.add('fade-out');
        startVideoSequence();
      }, 2000);
    }

    playButton.addEventListener('click', async () => {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      await audioContext.resume();
      startPlayback();
    });
  </script>
</body>
</html>
