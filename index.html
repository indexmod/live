<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIVE Stream</title>

<style>
html, body {
  margin:0; padding:0;
  width:100%; height:100%;
  background:black; overflow:hidden;
}

body {
  display:flex;
  justify-content:center;
  align-items:center;
}

#playButton {
  width:0; height:0;
  border-left:120px solid white;
  border-top:80px solid transparent;
  border-bottom:80px solid transparent;
  cursor:pointer;
  z-index:10;
  transition:opacity 1s;
}

#introText {
  position:fixed; inset:0;
  background:black; color:white;
  font-family:Arial,sans-serif;
  font-size:26px;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:60px;
  box-sizing:border-box;
  text-align:center;
  opacity:0;
  transition:opacity 2s;
  z-index:9;
}

video {
  position:fixed; inset:0;
  width:100%; height:100%;
  object-fit:cover;
  background:black;
  z-index:1;
}

.fade-in { opacity:1 !important; }
.fade-out { opacity:0 !important; }
</style>
</head>
<body>

<div id="playButton"></div>

<div id="introText">
  Этот проект — поток мастерской.<br>
  Без сценария. Без монтажа.
</div>

<video id="videoPlayer" muted playsinline></video>
<audio id="audioPlayer" loop src="audio.mp3"></audio>

<script>
const FILES = ['1.mp4','2.mp4','3.mp4','4.mp4'];

const playButton = document.getElementById('playButton');
const introText = document.getElementById('introText');
const video = document.getElementById('videoPlayer');
const audio = document.getElementById('audioPlayer');

let playlist = [];
let index = 0;

function shuffle(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
}

function buildPlaylist(){
  playlist = [...FILES];
  shuffle(playlist);
  index = 0;
}

function playVideo(i){
  video.src = playlist[i];
  video.play().catch(e => console.log("Video error:", e));
}

function nextVideo(){
  index++;
  if(index >= playlist.length){
    buildPlaylist();
  }
  playVideo(index);
}

video.addEventListener('ended', nextVideo);

async function start(){
  playButton.style.display='none';
  introText.classList.add('fade-in');

  await audio.play().catch(e=>console.log("Audio error:", e));

  buildPlaylist();

  setTimeout(()=>{
    introText.classList.add('fade-out');
    playVideo(index);
  },1500);
}

playButton.addEventListener('click', start);
</script>

</body>
</html>
