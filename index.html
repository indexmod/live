<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LIVE Stream</title>
  <meta name="theme-color" content="#000000" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: black;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #playButton {
      width: 0;
      height: 0;
      border-left: 150px solid white;
      border-top: 100px solid transparent;
      border-bottom: 100px solid transparent;
      cursor: pointer;
      transition: opacity 0.3s;
      z-index: 10;
    }

    #preloader {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: white;
      color: black;
      font-size: 80px;
      font-family: Arial, sans-serif;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9;
    }

    video {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
      display: none;
      background: black;
    }
  </style>
</head>
<body>

  <div id="playButton"></div>
  <div id="preloader">0%</div>
  <video id="videoPlayer" muted playsinline></video>
  <audio id="audioPlayer" loop src="audio.mp3"></audio>

  <script>
    const playButton = document.getElementById('playButton');
    const preloader = document.getElementById('preloader');
    const videoPlayer = document.getElementById('videoPlayer');
    const audioPlayer = document.getElementById('audioPlayer');

    const videos = [
      '1.m4v',
      '2.m4v',
      '3.m4v',
      '4.m4v',
      '5.m4v',
      '6.m4v'
    ];

    let loadedVideos = [];
    let lastVideo = null;
    let audioLoaded = false;

    // Показываем прогресс аудио
    function preloadAudioWithProgress() {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', audioPlayer.src, true);
        xhr.responseType = 'blob';

        xhr.onprogress = (e) => {
          if (e.lengthComputable) {
            const percent = Math.round((e.loaded / e.total) * 100);
            preloader.textContent = percent + '%';
          }
        };

        xhr.onload = () => {
          if (xhr.status === 200) {
            const blob = xhr.response;
            audioPlayer.src = URL.createObjectURL(blob);
            audioLoaded = true;
            resolve();
          } else {
            reject('Ошибка загрузки аудио');
          }
        };

        xhr.onerror = () => reject('Ошибка сети при загрузке аудио');
        xhr.send();
      });
    }

    // Предзагрузка видео по очереди
    function preloadVideosSequentially() {
      const queue = [...videos];

      function loadNext() {
        if (queue.length === 0) return;

        const nextSrc = queue.shift();
        const vid = document.createElement('video');
        vid.src = nextSrc;
        vid.preload = 'auto';
        vid.muted = true;
        vid.playsInline = true;

        vid.addEventListener('canplaythrough', () => {
          loadedVideos.push(nextSrc);

          // Если это первое видео — показать
          if (loadedVideos.length === 1) {
            videoPlayer.src = nextSrc;
            videoPlayer.style.display = 'block';
            videoPlayer.play();
          }

          // Загружаем следующее
          loadNext();
        }, { once: true });
      }

      loadNext();
    }

    // Выбор случайного видео
    function getRandomVideo() {
      const available = loadedVideos.filter(v => v !== lastVideo);
      if (available.length === 0) return lastVideo;
      const chosen = available[Math.floor(Math.random() * available.length)];
      lastVideo = chosen;
      return chosen;
    }

    // Ротация загруженных видео
    function startVideoRotation() {
      setInterval(() => {
        if (loadedVideos.length > 1) {
          const next = getRandomVideo();
          videoPlayer.src = next;
          videoPlayer.play();
        }
      }, 4000);
    }

    async function startPlayback() {
      playButton.style.display = 'none';
      preloader.style.display = 'flex';
      preloader.textContent = '0%';

      try {
        await preloadAudioWithProgress();
        preloader.textContent = 'Готово';
        await audioPlayer.play();
        preloader.style.display = 'none';

        // Начинаем подгрузку видео
        preloadVideosSequentially();
        startVideoRotation();
      } catch (err) {
        console.error(err);
        preloader.textContent = 'Ошибка';
      }
    }

    playButton.addEventListener('click', async () => {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      await audioContext.resume();
      startPlayback();
    });
  </script>
</body>
</html>
